<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akibworks Expense Tracker</title>
    <link rel="icon" type="image/png" href="images/spending.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Akibworks Expense Tracker</h1>
        </header>

        <main>
            <!-- Add Expense Form -->
            <section class="form-section">
                <h2>Add Expense</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="expenseDate">Date:</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="totalAmount">Total Amount:</label>
                        <input type="number" id="totalAmount" step="0.01" min="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Both">Both</option>
                            <option value="Domestic">Domestic</option>
                            <option value="Akib">Akib</option>
                            <option value="Saniya">Saniya</option>
                            <option value="Neha">Neha</option>
                            <option value="Family">Family</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Add Expense</button>
                </form>
            </section>

            <!-- Filter and Total Section -->
            <section class="filter-section">
                <div class="filter-group">
                    <label for="categoryFilter">Filter by Category:</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Both">Both</option>
                        <option value="Domestic">Domestic</option>
                        <option value="Akib">Akib</option>
                        <option value="Saniya">Saniya</option>
                        <option value="Neha">Neha</option>
                        <option value="Family">Family</option>
                    </select>
                </div>
                
                <div class="total-display">
                    <strong>Total Amount: $<span id="totalAmount">0.00</span></strong>
                </div>
            </section>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                Loading expenses...
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <!-- Success Message -->
            <div id="successMessage" class="success-message" style="display: none;"></div>

            <!-- Expenses Table -->
            <section class="table-section">
                <h2>Expenses</h2>
                <div class="table-container">
                    <table id="expensesTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody">
                            <!-- Expenses will be populated here -->
                        </tbody>
                    </table>
                    
                    <div id="noExpenses" class="no-expenses" style="display: none;">
                        No expenses found.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
